name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Actions are pinned to full commit SHAs, not tags like `v7`.
    # A tag can be moved to different code at any time (by the maintainer or by
    # someone who hijacked the repo), and CI would silently run it. A commit SHA
    # always points to exactly the same code. This is a wallet app that handles
    # keys, so we don't let third-party code change under us unnoticed.
    # The `# vX.Y.Z` comment shows the human-readable version; Dependabot
    # (.github/dependabot.yml) opens PRs to bump both the SHA and the comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint, unit tests, assemble debug
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
